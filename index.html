<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>flashcards — AI-native definitions</title>
    <meta name="description" content="Flashcards for AI-native vocabulary: CLI, MCP, token, RAG, agents, embeddings, fine-tuning, and more.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="./style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: '#0b0f17',
              card: '#111827',
              accent: '#7c3aed',
              soft: '#1f2937',
            },
          },
        },
      };
    </script>
</head>
<body class="bg-ink text-slate-100 min-h-screen antialiased">
    <header class="border-b border-slate-800">
        <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="./" class="text-lg font-semibold tracking-tight">
                <span class="text-accent">flash</span>cards
            </a>
            <nav class="text-sm text-slate-400 flex gap-4">
                <a href="https://github.com/kalachevandrew/flashcards" class="hover:text-slate-100" target="_blank" rel="noopener">GitHub</a>
            </nav>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-6 py-8">
        <section class="mb-8">
            <h1 class="text-3xl font-semibold tracking-tight mb-2">AI-native flashcards</h1>
            <p class="text-slate-400 max-w-2xl">
                The vocabulary of working with LLMs — CLI, MCP, token, RAG, agents, embeddings, fine-tuning.
                Click a card to flip it. Type to filter live.
            </p>
        </section>

        <section class="mb-6">
            <input
                id="search"
                type="search"
                placeholder="Search terms or definitions…"
                autocomplete="off"
                class="w-full bg-soft border border-slate-700 rounded-md px-4 py-2 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-accent"
            >
        </section>

        <section class="mb-6">
            <div id="tag-bar" class="flex flex-wrap gap-2"></div>
        </section>

        <section>
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-xs uppercase tracking-wide text-slate-500">Cards</h2>
                <p id="count" class="text-xs text-slate-500"></p>
            </div>
            <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            <div id="empty" class="hidden rounded-md border border-dashed border-slate-700 bg-soft/40 p-8 text-center text-slate-500">
                No cards match.
            </div>
        </section>
    </main>

    <footer class="max-w-5xl mx-auto px-6 py-8 text-xs text-slate-500">
        Built as a static site — vanilla HTML/JS, deployed to Netlify and GitHub Pages. MIT licensed.
    </footer>

    <template id="card-tmpl">
        <article class="flip-card" tabindex="0">
            <div class="flip-inner">
                <div class="flip-face flip-front bg-card border border-slate-700 rounded-lg p-5 flex flex-col justify-between">
                    <div>
                        <div class="text-xs uppercase tracking-wide text-accent mb-2" data-deck></div>
                        <h3 class="text-lg font-semibold text-white leading-snug" data-term></h3>
                    </div>
                    <div class="mt-4 flex flex-wrap gap-1.5" data-tags></div>
                    <div class="text-[10px] text-slate-600 mt-3">click to flip</div>
                </div>
                <div class="flip-face flip-back bg-soft border border-accent/40 rounded-lg p-5 overflow-y-auto">
                    <h3 class="text-sm font-semibold text-accent mb-2" data-term-back></h3>
                    <p class="text-sm text-slate-200 leading-relaxed" data-definition></p>
                    <a class="block mt-3 text-[11px] text-slate-400 hover:text-accent truncate" data-source target="_blank" rel="noopener" hidden>source ↗</a>
                </div>
            </div>
        </article>
    </template>

    <script src="./app.js" type="module"></script>
</body>
</html>
