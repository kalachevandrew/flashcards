<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>flashcards — AI words explained simply</title>
    <meta name="description" content="AI words explained the way you'd tell a 5-year-old. CLI, MCP, token, RAG, agents, embeddings, fine-tuning, and more.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="./style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              page: '#fafaf9',
              card: '#ffffff',
              ink: '#0f172a',
              muted: '#64748b',
              hairline: '#e2e8f0',
              accent: '#4f46e5',
              'accent-soft': '#eef2ff',
            },
          },
        },
      };
    </script>
</head>
<body class="bg-page text-ink min-h-screen antialiased">
    <header class="border-b border-hairline bg-white/70 backdrop-blur sticky top-0 z-10">
        <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="./" class="text-lg font-semibold tracking-tight">
                <span class="text-accent">flash</span><span class="text-ink">cards</span>
            </a>
            <nav class="text-sm text-muted flex gap-5">
                <a href="https://github.com/kalachevandrew/flashcards" class="hover:text-ink" target="_blank" rel="noopener">GitHub</a>
            </nav>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-6 py-10">
        <section class="mb-10">
            <h1 class="text-4xl font-semibold tracking-tight text-ink mb-3">AI words, explained simply</h1>
            <p class="text-muted max-w-2xl text-lg leading-relaxed">
                The vocabulary of working with AI — explained the way you'd tell a 5-year-old.
                Click a card to flip it. Type to filter.
            </p>
        </section>

        <section class="mb-6">
            <input
                id="search"
                type="search"
                placeholder="Search words or meanings…"
                autocomplete="off"
                class="w-full bg-white border border-hairline rounded-lg px-4 py-3 text-ink placeholder-muted focus:outline-none focus:border-accent focus:ring-2 focus:ring-accent/20 transition"
            >
        </section>

        <section class="mb-8">
            <div id="tag-bar" class="flex flex-wrap gap-2"></div>
        </section>

        <section>
            <div class="flex items-baseline justify-between mb-4">
                <h2 class="text-xs uppercase tracking-[0.14em] text-muted font-medium">Cards</h2>
                <p id="count" class="text-xs text-muted"></p>
            </div>
            <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            <div id="empty" class="hidden rounded-lg border border-dashed border-hairline bg-white p-10 text-center text-muted">
                No cards match.
            </div>
        </section>
    </main>

    <footer class="max-w-5xl mx-auto px-6 py-10 text-xs text-muted">
        Built as a static site — vanilla HTML/JS, deployed to Netlify and GitHub Pages. MIT licensed.
    </footer>

    <template id="card-tmpl">
        <article class="flip-card" tabindex="0">
            <div class="flip-inner">
                <div class="flip-face flip-front bg-card border border-hairline rounded-xl p-5 flex flex-col justify-between shadow-sm hover:shadow-md hover:border-accent/40 transition">
                    <div>
                        <div class="text-[10px] uppercase tracking-[0.14em] text-accent font-semibold mb-2" data-deck></div>
                        <h3 class="text-xl font-semibold text-ink leading-snug" data-term></h3>
                    </div>
                    <div class="mt-4 flex flex-wrap gap-1.5" data-tags></div>
                    <div class="text-[10px] text-muted mt-3">click to flip</div>
                </div>
                <div class="flip-face flip-back bg-accent-soft border border-accent/30 rounded-xl p-5 overflow-y-auto shadow-sm">
                    <h3 class="text-sm font-semibold text-accent mb-2" data-term-back></h3>
                    <p class="text-[15px] text-ink leading-relaxed" data-definition></p>
                    <a class="block mt-3 text-[11px] text-muted hover:text-accent truncate" data-source target="_blank" rel="noopener" hidden>source ↗</a>
                </div>
            </div>
        </article>
    </template>

    <script src="./app.js" type="module"></script>
</body>
</html>
