<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}flashcards — AI-native definitions{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/htmx.org@2.0.3" integrity="sha384-0895/pl2MU10Hqc6jd4RvrthNlDiE9U1tWmX7WRESftEDRosgxNsQG/Ze9YMRzHq" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: '#0b0f17',
              card: '#111827',
              accent: '#7c3aed',
              soft: '#1f2937',
            },
            fontFamily: {
              mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
            },
          },
        },
      };
    </script>
</head>
<body class="bg-ink text-slate-100 min-h-screen font-sans antialiased">
    <header class="border-b border-slate-800">
        <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="/" class="text-lg font-semibold tracking-tight">
                <span class="text-accent">flash</span>cards
            </a>
            <nav class="text-sm text-slate-400 flex gap-4">
                <a href="/" class="hover:text-slate-100">Home</a>
                <a href="/admin" class="hover:text-slate-100">Add card</a>
                <a href="https://github.com/akalachev/flashcards" class="hover:text-slate-100" target="_blank" rel="noopener">GitHub</a>
            </nav>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="max-w-5xl mx-auto px-6 py-8 text-xs text-slate-500">
        Built with FastAPI + HTMX + SQLite. MIT licensed.
    </footer>

    <script src="/static/flip.js"></script>
</body>
</html>
