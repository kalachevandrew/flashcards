<div class="flip-card" data-card-id="{{ card.id }}">
    <div class="flip-inner">
        <div class="flip-face flip-front bg-card border border-slate-700 rounded-lg p-5 flex flex-col justify-between">
            <div>
                <div class="text-xs uppercase tracking-wide text-accent mb-2">{{ card.deck_slug }}</div>
                <h3 class="text-lg font-semibold text-white leading-snug">{{ card.term }}</h3>
            </div>
            {% if card.tags %}
            <div class="mt-4 flex flex-wrap gap-1.5">
                {% for tag in card.tags %}
                <span class="text-[10px] uppercase tracking-wide text-slate-400 bg-slate-800 px-1.5 py-0.5 rounded">{{ tag }}</span>
                {% endfor %}
            </div>
            {% endif %}
            <div class="text-[10px] text-slate-600 mt-3">click to flip</div>
        </div>
        <div class="flip-face flip-back bg-soft border border-accent/40 rounded-lg p-5">
            <h3 class="text-sm font-semibold text-accent mb-2">{{ card.term }}</h3>
            <p class="text-sm text-slate-200 leading-relaxed">{{ card.definition }}</p>
            {% if card.source_url %}
            <a href="{{ card.source_url }}" target="_blank" rel="noopener"
               class="block mt-3 text-[11px] text-slate-400 hover:text-accent truncate"
               onclick="event.stopPropagation()">
                source ↗
            </a>
            {% endif %}
        </div>
    </div>
</div>
