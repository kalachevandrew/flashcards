{% if cards %}
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
    {% for card in cards %}
        {% include "_card.html" %}
    {% endfor %}
</div>
{% else %}
<div class="rounded-md border border-dashed border-slate-700 bg-soft/40 p-8 text-center text-slate-500">
    No cards match.
</div>
{% endif %}
