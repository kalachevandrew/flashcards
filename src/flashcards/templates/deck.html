{% extends "base.html" %}

{% block title %}{{ deck.name }} — flashcards{% endblock %}

{% block content %}
<nav class="text-sm text-slate-500 mb-2">
    <a href="/" class="hover:text-slate-200">← All decks</a>
</nav>

<section class="mb-6">
    <h1 class="text-3xl font-semibold tracking-tight">{{ deck.name }}</h1>
    {% if deck.description %}
    <p class="text-slate-400 mt-1">{{ deck.description }}</p>
    {% endif %}
    <p class="text-xs text-slate-500 mt-2">{{ deck.card_count }} cards</p>
</section>

<section class="mb-6">
    <input
        type="search"
        name="q"
        placeholder="Search within this deck…"
        autocomplete="off"
        class="w-full bg-soft border border-slate-700 rounded-md px-4 py-2 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-accent"
        hx-get="/api/cards?format=html&deck={{ deck.slug }}"
        hx-trigger="keyup changed delay:200ms, search"
        hx-target="#grid"
        hx-swap="innerHTML"
    >
</section>

<section>
    <div id="grid">
        {% include "_card_grid.html" %}
    </div>
</section>
{% endblock %}
